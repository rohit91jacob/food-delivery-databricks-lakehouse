name: Keep schedules alive

# GitHub disables scheduled workflows in public repositories after 60 days without repository
# activity. Once a month this re-enables every scheduled workflow through the API, using only
# the built-in GITHUB_TOKEN. It makes no commits.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wf in refresh.yml keepalive.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable"
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf" --jq .state)
            echo "$wf: $state"
            [ "$state" = "active" ]
          done
