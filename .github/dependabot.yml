version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # delta-spark 4.4.x requires pyspark <= 4.2; bumping pyspark alone makes the lock unsolvable.
      # Drop this once a delta-spark release supports the newer pyspark.
      - dependency-name: pyspark
        versions: [">=4.3"]
  - package-ecosystem: docker
    directory: /airflow
    schedule:
      interval: weekly
