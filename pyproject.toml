[project]
name = "fooddelivery"
version = "0.1.0"
description = "Food-delivery lakehouse: a Kaggle-seeded synthetic data generator, Databricks Lakeflow pipelines and Apache Airflow orchestration."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rohit91jacob" }]
# Databricks serverless environment 5 runs Python 3.12, and the same package is installed
# into the Lakeflow pipeline, the serverless DQ job task and the Airflow image.
requires-python = ">=3.12,<3.13"
# Deliberately empty: the package runs inside Databricks serverless (where pyspark and
# databricks-sdk are provided) and inside Airflow. Side-specific deps live in extras.
dependencies = []

[project.optional-dependencies]
seed = ["kaggle>=2.2,<3"]
databricks = ["databricks-sdk>=0.60,<1"]

[project.scripts]
fd = "fooddelivery.cli:main"
fd-dq = "fooddelivery.quality.runner:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "regex==2026.9.29",
]
spark = [
    "pyspark==4.0.1",
    "delta-spark==4.0.1",
]
airflow = [
    "apache-airflow==3.3.2",
    "apache-airflow-providers-databricks==7.20.0",
    "kaggle==2.2.4",
    "databricks-sdk==0.148.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fooddelivery"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "airflow/dags"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "RUF046", "SIM102", "SIM108", "SIM113"]

[tool.ruff.lint.per-file-ignores]
# Lakeflow pipeline sources get `spark` injected as a global by the runtime.
"src/fooddelivery_pipeline/**" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["fooddelivery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "spark: needs a local Spark + Delta session (dependency group `spark`)",
    "airflow: needs Apache Airflow installed (dependency group `airflow`)",
    "slow: end-to-end tests that generate several days of data",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
]
